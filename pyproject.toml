[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peerlink"
dynamic = ["version"]
description = "Human-approved project agent collaboration MVP"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "websockets>=14,<17"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
peerlink = "peerlink.cli:main"

[tool.setuptools.package-data]
peerlink = ["static/*", "bundled_skill/*", "bundled_skill/agents/*"]

[tool.setuptools.packages.find]
include = ["peerlink*"]

[tool.setuptools.dynamic]
version = {attr = "peerlink.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
